<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Google/title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #080808;
  color: #fff;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 700px;
  margin: 40px auto;
  background: #151515;
  border: 1px solid #292929;
  border-radius: 16px;
  padding: 24px;
}

h1 {
  color: #d4af37;
  font-size: 24px;
}

.subtitle {
  color: #aaa;
  line-height: 1.8;
}

.status {
  background: #202020;
  padding: 15px;
  border-radius: 8px;
  margin: 20px 0;
}

button {
  background: #d4af37;
  color: #080808;
  border: 0;
  padding: 12px 18px;
  border-radius: 8px;
  font-weight: bold;
  cursor: pointer;
}

table {
  width: 100%;
  margin-top: 20px;
  border-collapse: collapse;
}

th, td {
  border-bottom: 1px solid #333;
  padding: 12px 8px;
  text-align: right;
  overflow-wrap: anywhere;
}

th {
  color: #d4af37;
}

.empty {
  color: #aaa;
  padding: 20px 0;
}

.note {
  color: #999;
  font-size: 13px;
  line-height: 1.8;
  margin-top: 25px;
}
</style>
</head>

<body>
<div class="container">

  <h1>Gmail</h1>

  <p class="subtitle">
    لوحة مستقلة لمراجعة بيانات الاختبار المحفوظة على هذا الجهاز.
  </p>

  <div class="status" id="status">
    البيانات المعروضة محلية على هذا الجهاز فقط.
  </div>

  <button onclick="loadData()">تحديث البيانات</button>

  <table>
    <thead>
      <tr>
        <th>البريد الإلكتروني</th>
        <th>حالة التسجيل</th>
      </tr>
    </thead>
    <tbody id="records"></tbody>
  </table>

  <p class="empty" id="empty">
    لا توجد بيانات اختبار محفوظة حتى الآن.
  </p>

  <p class="note">
    هذه اللوحة لا تتصل بخادم ولا تستقبل بيانات من أجهزة أخرى.
    ادخل كلمه المرور حقيقية أو بيانات حسابات شخصية.
  </p>

</div>

<script>
function loadData() {
  const records = document.getElementById("records");
  const empty = document.getElementById("empty");

  records.replaceChildren();

  // عرض بيانات الاختبار المحفوظة محليًا إن وجدت.
  const saved = JSON.parse(
    localStorage.getItem("mailTestRecords") || "[]"
  );

  saved.forEach(item => {
    const row = document.createElement("tr");
    const email = document.createElement("td");
    const status = document.createElement("td");

    email.textContent = item.email || "";
    status.textContent = item.status || "Gmail";

    row.append(email, status);
    records.appendChild(row);
  });

  empty.style.display = saved.length ? "none" : "block";
}

loadData();
</script>

</body>
</html>
