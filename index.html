<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Mail Test</title>

<style>
* {
  box-sizing: border-box;
}

body {
  margin: 0;
  padding: 20px;
  background: #080808;
  color: white;
  font-family: Arial, sans-serif;
}

.container {
  max-width: 450px;
  margin: 40px auto;
  background: #151515;
  border: 1px solid #d4af37;
  border-radius: 16px;
  padding: 24px;
}

h1 {
  color: #d4af37;
  text-align: center;
}

p {
  color: #bbb;
  line-height: 1.8;
}

label {
  display: block;
  margin-top: 18px;
  margin-bottom: 8px;
}

input {
  width: 100%;
  padding: 13px;
  border: 1px solid #444;
  border-radius: 8px;
  background: #080808;
  color: white;
  font-size: 16px;
}

button {
  width: 100%;
  margin-top: 22px;
  padding: 13px;
  border: none;
  border-radius: 8px;
  background: #d4af37;
  color: #080808;
  font-size: 16px;
  font-weight: bold;
  cursor: pointer;
}

#message {
  margin-top: 18px;
  text-align: center;
}
</style>
</head>

<body>
<div class="container">

  <h1>Mail Test</h1>

  <p>صفحة تسجيل تجريبية لاختبار النموذج.</p>

  <form id="testForm">

    <label for="username">اسم المستخدم</label>
    <input
      id="username"
      type="text"
      placeholder="اكتب اسمًا تجريبيًا"
      required
    >

    <label for="email">البريد الإلكتروني التجريبي</label>
    <input
      id="email"
      type="email"
      placeholder="example@test.com"
      required
    >

    <button type="submit">تسجيل تجريبي</button>

  </form>

  <p id="message" role="status"></p>

</div>

<script>
document.getElementById("testForm").addEventListener("submit", function(event) {
  event.preventDefault();

  const username = document.getElementById("username").value.trim();
  const email = document.getElementById("email").value.trim();

  document.getElementById("message").textContent =
    "تم الاختبار بنجاح يا " + username +
    ". البريد التجريبي: " + email;

  this.reset();
});
</script>

</body>
</html>
